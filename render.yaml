services:
  - type: web
    name: game-backlog
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-backlog-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: APP_HOST
        sync: false

databases:
  - name: game-backlog-db
    databaseName: game_backlog
    user: game_backlog